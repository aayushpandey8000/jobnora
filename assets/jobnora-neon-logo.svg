<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Jobnora — Smarter job search with AI</title><desc id="desc">White Jobnora wordmark inside a glowing cyan, blue and violet neon ring on a midnight navy background.</desc>
<defs>
 <radialGradient id="bg"><stop offset="0" stop-color="#070d2a"/><stop offset="1" stop-color="#020617"/></radialGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00f5ff"/><stop offset=".35" stop-color="#126bff"/><stop offset=".68" stop-color="#9b36ff"/><stop offset="1" stop-color="#ff42f5"/></linearGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="19" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1200" height="1200" fill="url(#bg)"/>
<circle cx="600" cy="520" r="288" fill="none" stroke="url(#neon)" stroke-width="12" opacity=".45" filter="url(#soft)"/>
<path d="M600 232 C742 232 856 337 884 465 C912 594 825 730 705 791 C620 834 529 797 455 753 C349 691 295 581 319 478 C341 383 421 310 497 263 C532 241 564 232 600 232Z" fill="none" stroke="url(#neon)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
<path d="M600 232 C742 232 856 337 884 465 C912 594 825 730 705 791 C620 834 529 797 455 753 C349 691 295 581 319 478 C341 383 421 310 497 263 C532 241 564 232 600 232Z" fill="none" stroke="#c9faff" stroke-width="2.5" opacity=".85"/>
<text x="600" y="558" fill="#fff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="124" font-weight="750" text-anchor="middle" letter-spacing="-5">Jobnora</text>
<text x="600" y="927" fill="#fff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="39" font-weight="500" text-anchor="middle" letter-spacing="12">SMARTER JOB SEARCH</text>
<text x="600" y="987" fill="#fff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="39" font-weight="500" text-anchor="middle" letter-spacing="12">WITH AI</text>
</svg>